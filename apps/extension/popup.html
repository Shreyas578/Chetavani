<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #080c14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #ff7700;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #ff9933;
    }
    .status-box {
      background: #0f1626;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .domain {
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }
    .badge-safe {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-warn {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background: #ff7700;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 8px;
    }
    .btn:hover {
      background: #e66b00;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">च</div>
    <div>
      <div class="title">Chetavani Shield</div>
      <div style="font-size: 10px; color: #94a3b8;">Arkiv DB-Chain Protection</div>
    </div>
  </div>

  <div class="status-box">
    <div style="font-size: 11px; color: #94a3b8;">CURRENT DOMAIN</div>
    <div id="domainDisplay" class="domain">Checking...</div>
    <div id="statusBadge" class="badge badge-safe">Checking Arkiv...</div>
    <div id="reasonText" style="font-size: 11px; color: #cbd5e1; margin-top: 6px;"></div>
  </div>

  <a id="reportBtn" href="#" target="_blank" class="btn">Report This Page on Chetavani</a>
  <div class="footer">Chain: Tiramisu (7738577) • Zero Keys Stored</div>

  <script src="popup.js"></script>
</body>
</html>
